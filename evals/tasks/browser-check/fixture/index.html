<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>To-do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>To-do</h1>
        <form id="add-form">

    <script type="module" src="app.js"></script>
</body>
</html>
